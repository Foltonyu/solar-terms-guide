<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>节气食光 - 二十四节气互动养生指南</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- HERO SECTION -->
<section class="hero">
  <div class="particles" id="particles"></div>
  <div class="hero__mountains">
    <svg viewBox="0 0 1440 180" preserveAspectRatio="none">
      <path d="M0,180 L0,100 Q120,30 240,80 Q360,130 480,60 Q600,0 720,50 Q840,100 960,40 Q1080,0 1200,70 Q1320,130 1440,80 L1440,180 Z" fill="rgba(245,240,232,0.15)"/>
      <path d="M0,180 L0,130 Q180,70 360,110 Q540,150 720,90 Q900,40 1080,100 Q1260,150 1440,110 L1440,180 Z" fill="rgba(245,240,232,0.08)"/>
    </svg>
  </div>
  <h1 class="hero__title">节气食光</h1>
  <p class="hero__subtitle">二十四节气互动养生指南</p>
  <p class="hero__tagline">顺应天时，食养合一，感受千年智慧的生活美学</p>
  <button class="hero__btn" id="hero-btn">探索节气 ↓</button>
</section>

<!-- FEATURED CURRENT TERM -->
<section class="featured" id="featured">
  <div class="brush-divider"></div>
  <div id="featured-content"></div>
</section>

<!-- CIRCULAR WHEEL -->
<section class="wheel-section" id="wheel-section">
  <h2 class="section-title">二十四节气轮</h2>
  <p class="section-subtitle">点击任意节气查看详情</p>
  <div class="wheel-container" id="wheel-svg"></div>
</section>

<!-- FILTER BAR -->
<div class="filter-bar" id="filter-bar">
  <button class="filter-btn active" data-season="all">全部</button>
  <button class="filter-btn" data-season="spring">春</button>
  <button class="filter-btn" data-season="summer">夏</button>
  <button class="filter-btn" data-season="autumn">秋</button>
  <button class="filter-btn" data-season="winter">冬</button>
</div>

<!-- CARDS GRID -->
<section class="cards-section">
  <h2 class="section-title">节气详览</h2>
  <div class="brush-divider"></div>
  <div class="cards-grid" id="cards-grid"></div>
</section>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <button class="modal__nav modal__nav--prev" id="modal-prev">‹</button>
  <div class="modal">
    <button class="modal__close" id="modal-close">&times;</button>
    <div class="modal__icon" id="modal-icon"></div>
    <h2 class="modal__name" id="modal-name"></h2>
    <span class="modal__season-tag" id="modal-season-tag"></span>
    <p class="modal__date" id="modal-date"></p>
    <p class="modal__desc" id="modal-desc"></p>
    <div class="modal__section">
      <h4>🥬 时令食材</h4>
      <div class="modal__foods-grid" id="modal-foods"></div>
    </div>
    <div class="modal__section">
      <h4>🧘 养生建议</h4>
      <ul id="modal-tips"></ul>
    </div>
    <div class="modal__poem">
      <div class="modal__poem-text" id="modal-poem-text"></div>
      <div class="modal__poem-author" id="modal-poem-author"></div>
    </div>
  </div>
  <button class="modal__nav modal__nav--next" id="modal-next">›</button>
</div>

<!-- WHEEL TOOLTIP -->
<div class="wheel-tooltip" id="wheel-tooltip"></div>

<!-- FOOTER -->
<footer class="footer">
  <p><span>节气食光</span> · 顺应自然，颐养天年</p>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
